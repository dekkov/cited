name: Feature Request
description: Suggest a new feature or improvement
labels: ["enhancement", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Feature requests are welcome! Note that this is a solo-maintained project (~2h/week triage).
        If you'd like to build this yourself, mention it below.
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What problem does this feature solve? What's the current limitation?
    validations:
      required: true
  - type: textarea
    id: proposed_solution
    attributes:
      label: Proposed solution
      description: Describe the feature you'd like to see.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Any alternative approaches you've thought about?
  - type: dropdown
    id: will_pr
    attributes:
      label: Would you open a PR for this?
      options:
        - "Yes"
        - "No"
        - "Maybe"
    validations:
      required: true
